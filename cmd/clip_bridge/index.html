<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>互传中转站</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --fg:#1c1f23; --dim:#6b7280;
    --accent:#2f6df6; --accent-fg:#fff; --danger:#d64545; --ok:#1f9d55;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15171a; --card:#1e2126; --line:#2f343b; --fg:#e8eaed; --dim:#9aa2ad;
           --accent:#4b83f7; --danger:#e56b6b; --ok:#4cc38a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.6 system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;
       padding:0 0 40px}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  header{display:flex;align-items:center;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:650}
  .addr{color:var(--dim);font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .spacer{flex:1}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);
         border-radius:8px;padding:7px 13px;cursor:pointer}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:600}
  button.mini{padding:4px 9px;font-size:13px;border-radius:7px}
  button.danger{color:var(--danger)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:9px;
           padding:10px;background:transparent;color:var(--fg);font:inherit}
  textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .hint{color:var(--dim);font-size:13px}
  #drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--dim)}
  #drop.hot{border-color:var(--accent);color:var(--accent)}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px;display:none}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px}
  .meta{color:var(--dim);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .text{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;max-height:11em;overflow:auto}
  .fname{font-weight:600;word-break:break-all;margin:4px 0 0}
  .thumb{max-width:100%;max-height:220px;border-radius:8px;margin-top:8px;display:block}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  a.btn{text-decoration:none;display:inline-block}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000c;color:#fff;
         padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
  #toast.on{opacity:1}
  dialog{border:none;border-radius:14px;background:var(--card);color:var(--fg);padding:18px;text-align:center}
  dialog::backdrop{background:#0009}
  .empty{text-align:center;color:var(--dim);padding:26px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>互传中转站</h1>
    <span class="addr" id="addr"></span>
    <span class="spacer"></span>
    <button class="mini" id="qrBtn">二维码</button>
    <button class="mini danger" id="clearBtn">清空</button>
  </header>

  <div class="card">
    <textarea id="text" placeholder="粘贴或输入文字，Ctrl+Enter 发送。图片可以直接粘进来。"></textarea>
    <div class="row">
      <button class="primary" id="sendText">发送文字</button>
      <span class="hint">发出去的内容两边都看得到</span>
    </div>
  </div>

  <div class="card">
    <div id="drop">
      把文件拖到这里，或者
      <button class="mini" id="pickBtn">选择文件</button>
      <input type="file" id="file" multiple hidden>
    </div>
    <div class="bar" id="bar"><i></i></div>
  </div>

  <div id="list"></div>
</div>

<div id="toast"></div>
<dialog id="qr">
  <div style="font-size:14px;margin-bottom:10px">手机扫这个（要连同一个 Wi-Fi）</div>
  <img id="qrImg" width="300" height="300" alt="二维码">
  <div class="addr" id="qrAddr" style="margin-top:8px"></div>
  <div class="row" style="justify-content:center"><button id="qrClose">关闭</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const listEl = $('#list');
let lastSig = '';

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2200);
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function size(n){
  if(n < 1024) return n + ' B';
  const u = ['KB','MB','GB','TB']; let i = -1;
  do { n /= 1024; i++; } while(n >= 1024 && i < u.length-1);
  return n.toFixed(1) + ' ' + u[i];
}
function when(ts){
  const d = new Date(ts*1000), now = new Date();
  const hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString() === now.toDateString()) return hm;
  return (d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
// http 页面上没有 navigator.clipboard，手机必须走这个兜底
async function copy(txt){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); toast('已复制'); return; }
    throw 0;
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    toast(ok ? '已复制' : '复制失败，长按选中吧');
  }
}
async function api(path, body){
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const j = await r.json().catch(()=>({error:'服务端没回 JSON'}));
  if(!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function render(items){
  if(!items.length){ listEl.innerHTML = '<div class="empty">还没有内容</div>'; return; }
  listEl.innerHTML = items.map(it => {
    const head = `<div class="meta"><span>${when(it.created)}</span><span>${it.from||''}</span>` +
      (it.type==='file' ? `<span>${size(it.size)}</span>` : `<span>文字</span>`) + `</div>`;
    let body, acts;
    if(it.type === 'text'){
      body = `<div class="text">${esc(it.text)}</div>`;
      acts = `<button class="mini" data-copy="${it.id}">复制</button>`;
    }else{
      const img = (it.mime||'').startsWith('image/') ? `<img class="thumb" src="/api/file/${it.id}?inline=1" loading="lazy">` : '';
      body = `<div class="fname">${esc(it.name)}</div>${img}`;
      acts = `<a class="btn" href="/api/file/${it.id}" download><button class="mini">下载</button></a>` +
             `<a class="btn" href="/api/file/${it.id}?inline=1" target="_blank"><button class="mini">打开</button></a>`;
    }
    acts += `<button class="mini" data-mail="${it.id}">邮件</button>` +
            `<button class="mini danger" data-del="${it.id}">删除</button>`;
    return `<div class="item">${head}${body}<div class="acts">${acts}</div></div>`;
  }).join('');
}

let cache = [];
async function refresh(){
  try{
    const j = await api('/api/items');
    const sig = JSON.stringify(j.items.map(i=>i.id));
    cache = j.items;
    if(sig !== lastSig){ lastSig = sig; render(j.items); }
  }catch(e){ /* 手机息屏回来会失败一次，忽略 */ }
}

listEl.addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  const id = b.dataset.copy || b.dataset.mail || b.dataset.del; if(!id) return;
  const it = cache.find(x => x.id === id);
  if(b.dataset.copy){ copy(it ? it.text : ''); return; }
  if(b.dataset.del){
    b.disabled = true;
    try{ await api('/api/delete', {id}); lastSig=''; await refresh(); toast('已删除'); }
    catch(err){ toast(err.message); b.disabled = false; }
    return;
  }
  if(b.dataset.mail){
    b.disabled = true; b.textContent = '发送中';
    try{ const j = await api('/api/mail', {id}); toast(j.ok); }
    catch(err){ toast(err.message); }
    b.disabled = false; b.textContent = '邮件';
  }
});

$('#sendText').onclick = async () => {
  const t = $('#text').value;
  if(!t.trim()){ toast('先写点东西'); return; }
  try{ await api('/api/text', {text:t}); $('#text').value=''; lastSig=''; await refresh(); toast('已发送'); }
  catch(e){ toast(e.message); }
};
$('#text').addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#sendText').click();
});
$('#text').addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])];
  if(files.length){ e.preventDefault(); upload(files); }
});

function upload(files){
  if(!files.length) return;
  const fd = new FormData();
  for(const f of files) fd.append('f', f, f.name);
  const bar = $('#bar'), fill = bar.querySelector('i');
  bar.style.display = 'block'; fill.style.width = '0';
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.upload.onprogress = ev => { if(ev.lengthComputable) fill.style.width = (ev.loaded/ev.total*100) + '%'; };
  xhr.onload = async () => {
    bar.style.display = 'none';
    let j = {}; try{ j = JSON.parse(xhr.responseText); }catch(e){}
    if(xhr.status === 200){ lastSig=''; await refresh(); toast('已上传 ' + (j.items ? j.items.length : 0) + ' 个'); }
    else toast(j.error || ('上传失败 ' + xhr.status));
  };
  xhr.onerror = () => { bar.style.display='none'; toast('上传中断了'); };
  xhr.send(fd);
}
$('#pickBtn').onclick = () => $('#file').click();
$('#file').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
const drop = $('#drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', e => upload([...e.dataTransfer.files]));
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

$('#addr').textContent = location.host;
$('#qrBtn').onclick = () => {
  $('#qrImg').src = '/api/qr?size=300&data=' + encodeURIComponent(location.origin);
  $('#qrAddr').textContent = location.origin;
  $('#qr').showModal();
};
$('#qrClose').onclick = () => $('#qr').close();
$('#clearBtn').onclick = async () => {
  if(!confirm('把所有内容和文件都删掉？')) return;
  try{ const j = await api('/api/delete', {all:true}); lastSig=''; await refresh(); toast('清掉了 ' + j.deleted + ' 条'); }
  catch(e){ toast(e.message); }
};

refresh();
setInterval(refresh, 3000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(); });
</script>
</body>
</html>
