<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录声音转文字</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --fg: #1c1e21; --dim: #6b7280;
    --line: #e3e6ea; --accent: #2563eb; --danger: #dc2626; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --card: #1f2227; --fg: #e6e8ea; --dim: #9aa1ab;
      --line: #2d3138; --accent: #5b8cf5; --danger: #f2645a; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--fg);
         font: 15px/1.6 system-ui, "Noto Sans CJK SC", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; }
  input[type=text], input[type=number], select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; min-width: 0; }
  .checks { display: flex; gap: 18px; flex-wrap: wrap; margin: 14px 0 4px; }
  .checks label { display: flex; align-items: center; gap: 6px; color: var(--fg);
                  font-size: 14px; margin: 0; cursor: pointer; }
  button { padding: 9px 18px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--card); color: var(--fg); font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.stop { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  button.mini { padding: 4px 10px; font-size: 13px; }
  .bigbtn { margin-top: 16px; }
  .meter { height: 12px; border-radius: 6px; background: var(--line);
           overflow: hidden; margin: 8px 0 4px; }
  .meter > i { display: block; height: 100%; width: 0; background: var(--ok);
               transition: width .12s linear; }
  .stat { display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; }
  .stat b { font-variant-numeric: tabular-nums; font-size: 18px; display: block; }
  .stat span { color: var(--dim); font-size: 12px; }
  .banner { padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 12px; }
  .banner.err { background: #fee2e2; color: #991b1b; }
  @media (prefers-color-scheme: dark) { .banner.err { background: #3b1a1a; color: #fca5a5; } }
  .rec { border-top: 1px solid var(--line); padding: 12px 0; }
  .rec:first-child { border-top: 0; }
  .rec h3 { margin: 0 0 2px; font-size: 15px; }
  .rec .meta { color: var(--dim); font-size: 12.5px; margin-bottom: 8px; }
  .rec .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .text { margin-top: 10px; padding: 10px 12px; background: var(--bg);
          border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap;
          max-height: 320px; overflow: auto; font-size: 14px; }
  .hint { color: var(--dim); font-size: 12.5px; margin-top: 10px; }
  .empty { color: var(--dim); font-size: 14px; }
  audio { width: 100%; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>录声音转文字</h1>
  <p class="sub">录的是声卡输出那一路，也就是你耳朵听到的东西。跟网站、播放器、加不加密都没关系——能放出声就能录。只能 1 倍速。</p>

  <div id="banner"></div>

  <div class="card" id="setup">
    <div class="row">
      <div>
        <label>录哪一路</label>
        <select id="source"></select>
      </div>
      <div>
        <label>叫什么名字（可留空）</label>
        <input type="text" id="title" placeholder="比如 51cto-K8s-第3课">
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <div>
        <label>静音多久算放完了，自动停（秒，0 = 不自动停）</label>
        <input type="number" id="autoStop" value="60" min="0" step="10">
      </div>
      <div>
        <label>多轻算静音（LUFS，越小越迟钝）</label>
        <input type="number" id="silenceDB" value="-50" step="5">
      </div>
    </div>
    <div class="checks">
      <label><input type="checkbox" id="doTranscribe" checked> 录完自动转文字</label>
      <label><input type="checkbox" id="doMail"> 转完把文字发到我邮箱</label>
    </div>
    <div class="bigbtn">
      <button class="primary" id="startBtn">开始录音</button>
    </div>
    <p class="hint">点了开始之后切到浏览器点播放就行。系统音量别调太小，monitor 录的是音量之后的声音。</p>
  </div>

  <div class="card" id="live" style="display:none">
    <div class="stat">
      <div><b id="elapsed">0:00</b><span>已录时长</span></div>
      <div><b id="lvl">--</b><span>当前响度 LUFS</span></div>
      <div><b id="silent">--</b><span>已静音</span></div>
      <div><b id="stateTxt">录音中</b><span>状态</span></div>
    </div>
    <div class="meter"><i id="bar"></i></div>
    <p class="hint" id="liveHint">条子会动就说明真的录到声了。一直贴着最左边 = 没录到，检查上面选的音源。</p>
    <div class="bigbtn"><button class="stop" id="stopBtn">停止并转文字</button></div>
  </div>

  <div class="card">
    <h1 style="font-size:16px;margin-bottom:12px">录过的</h1>
    <div id="list" class="empty">还没有录过</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fmtTime = s => {
  s = Math.max(0, Math.floor(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`
           : `${m}:${String(x).padStart(2,'0')}`;
};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get('content-type') || '';
  const body = ct.includes('json') ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.error) || body || ('HTTP ' + r.status));
  return body;
}

function banner(msg, kind) {
  $('banner').innerHTML = msg ? `<div class="banner ${kind||'err'}">${esc(msg)}</div>` : '';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 音源 ----
async function loadSources() {
  const list = await api('/api/sources');
  const sel = $('source');
  sel.innerHTML = '';
  if (!list || !list.length) {
    sel.innerHTML = '<option value="">没找到音源，PipeWire 是不是没起来</option>';
    return;
  }
  for (const s of list) {
    const o = document.createElement('option');
    o.value = s.name;
    o.textContent = (s.monitor ? '扬声器输出（录电脑的声音）— ' : '麦克风一类 — ') + s.desc;
    sel.appendChild(o);
  }
}

// ---- 开始 / 停止 ----
$('startBtn').onclick = async () => {
  banner('');
  $('startBtn').disabled = true;
  try {
    await api('/api/start', {
      method: 'POST',
      body: JSON.stringify({
        source: $('source').value,
        title: $('title').value,
        autoStop: parseInt($('autoStop').value || '0', 10),
        silenceDB: parseFloat($('silenceDB').value || '-50'),
        transcribe: $('doTranscribe').checked,
        mail: $('doMail').checked,
      }),
    });
  } catch (e) { banner(e.message); }
  $('startBtn').disabled = false;
};

$('stopBtn').onclick = async () => {
  $('stopBtn').disabled = true;
  try { await api('/api/stop', { method: 'POST' }); }
  catch (e) { banner(e.message); }
  $('stopBtn').disabled = false;
};

// ---- 实时状态 ----
let lastState = '';
function applyStatus(st) {
  const rec = st.state === 'recording';
  $('live').style.display = (st.state === 'idle') ? 'none' : '';
  $('setup').style.display = (st.state === 'idle') ? '' : 'none';
  $('stopBtn').style.display = rec ? '' : 'none';

  if (rec) {
    $('elapsed').textContent = fmtTime(st.elapsed || 0);
    const lv = st.level == null ? -120 : st.level;
    $('lvl').textContent = lv <= -119 ? '静' : lv.toFixed(1);
    // -60 ~ 0 LUFS 映射成 0 ~ 100%
    $('bar').style.width = Math.max(0, Math.min(100, (lv + 60) / 60 * 100)) + '%';
    $('bar').style.background = lv > -50 ? 'var(--ok)' : 'var(--dim)';
    $('silent').textContent = st.heard ? fmtTime(st.silentFor || 0) : '等第一声';
    $('stateTxt').textContent = st.autoStop > 0 ? `静音 ${st.autoStop} 秒自动停` : '不会自动停';
    $('liveHint').style.display = '';
  } else {
    $('stateTxt').textContent = st.stage || '';
    $('liveHint').style.display = 'none';
    $('bar').style.width = '100%';
    $('bar').style.background = 'var(--accent)';
  }
  if (st.err) banner(st.err);
  // 一从忙碌回到闲着就刷新列表
  if (lastState && lastState !== 'idle' && st.state === 'idle') loadList();
  lastState = st.state;
}

function connect() {
  const es = new EventSource('/api/events');
  es.addEventListener('status', e => applyStatus(JSON.parse(e.data)));
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

// ---- 历史 ----
async function loadList() {
  const list = await api('/api/list');
  const box = $('list');
  if (!list || !list.length) { box.className = 'empty'; box.textContent = '还没有录过'; return; }
  box.className = '';
  box.innerHTML = list.map(r => {
    const when = new Date(r.started * 1000).toLocaleString('zh-CN');
    const bits = [when, fmtTime(r.duration)];
    if (r.err) bits.push('出错：' + r.err);
    const n = encodeURIComponent(r.name);
    return `<div class="rec">
      <h3>${esc(r.title || r.name)}</h3>
      <div class="meta">${esc(bits.join('  ·  '))}</div>
      <div class="btns">
        ${r.hasAudio ? `<button class="mini" data-play="${n}">听</button>` : ''}
        ${r.hasAudio ? `<button class="mini" data-dl="${n}" data-ext="mp3">下音频</button>` : ''}
        ${r.hasText ? `<button class="mini" data-show="${n}">看全文</button>` : ''}
        ${r.hasText ? `<button class="mini" data-dl="${n}" data-ext="txt">下文字</button>` : ''}
        ${r.hasSrt ? `<button class="mini" data-dl="${n}" data-ext="srt">下字幕</button>` : ''}
        ${r.hasText ? `<button class="mini" data-mail="${n}">发邮件</button>` : ''}
        ${r.hasAudio ? `<button class="mini" data-retry="${n}">重新转文字</button>` : ''}
        <button class="mini" data-del="${n}">删除</button>
      </div>
      <div class="slot" id="slot-${esc(r.name)}"></div>
      ${r.hasText ? `<div class="text" id="txt-${esc(r.name)}" style="display:none">${esc(r.text)}</div>` : ''}
    </div>`;
  }).join('');
}

$('list').onclick = async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  try {
    if (d.show) {
      const el = document.getElementById('txt-' + decodeURIComponent(d.show));
      const open = el.style.display !== 'none';
      el.style.display = open ? 'none' : '';
      b.textContent = open ? '看全文' : '收起';
    } else if (d.dl) {
      // 服务端带 Content-Disposition，直接开新窗口下载
      window.location = `/api/file?name=${d.dl}&ext=${d.ext}`;
    } else if (d.play) {
      const slot = document.getElementById('slot-' + decodeURIComponent(d.play));
      if (slot.firstChild) { slot.innerHTML = ''; b.textContent = '听'; return; }
      b.disabled = true;
      // 先 fetch 再喂 blob：直接 new Audio(url) 出错时只会说一句废话
      const r = await fetch('/api/audio?name=' + d.play);
      if (!r.ok) throw new Error(await r.text());
      const a = document.createElement('audio');
      a.controls = true;
      a.src = URL.createObjectURL(await r.blob());
      slot.appendChild(a);
      b.disabled = false; b.textContent = '收起';
    } else if (d.mail) {
      b.disabled = true; b.textContent = '发送中';
      await api('/api/mail?name=' + d.mail, { method: 'POST' });
      b.textContent = '已发出';
    } else if (d.retry) {
      await api('/api/retranscribe?name=' + d.retry, { method: 'POST' });
      banner('');
    } else if (d.del) {
      if (!confirm('连音频带文字一起删掉？')) return;
      await api('/api/delete?name=' + d.del, { method: 'POST' });
      loadList();
    }
  } catch (err) { banner(err.message); b.disabled = false; }
};

loadSources().catch(e => banner(e.message));
loadList().catch(e => banner(e.message));
connect();
</script>
</body>
</html>
