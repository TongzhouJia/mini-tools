<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>常用操作</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--fg:#1c1f23;--dim:#6b7280;
        --accent:#2f6df6;--ok:#1f9d55;--danger:#d64545;--code:#f1f3f6}
  @media (prefers-color-scheme:dark){
    :root{--bg:#15171a;--card:#1e2126;--line:#2f343b;--fg:#e8eaed;--dim:#9aa2ad;
          --accent:#4b83f7;--ok:#4cc38a;--danger:#e56b6b;--code:#262a30}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);padding:0 0 40px;
       font:15px/1.6 system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:0 14px}
  header{display:flex;align-items:baseline;gap:10px;padding:16px 0 6px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:650}
  h2{font-size:14px;font-weight:600;color:var(--dim);margin:22px 0 8px}
  .spacer{flex:1}
  .hint{color:var(--dim);font-size:13px}
  code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);
         border-radius:8px;padding:5px 13px;cursor:pointer;flex:none}
  button.run{background:var(--accent);border-color:var(--accent);color:#fff}
  button.run.danger{background:var(--danger);border-color:var(--danger)}
  button.mini{padding:2px 9px;font-size:12.5px;border-radius:7px}
  button:disabled{opacity:.6;cursor:default}
  button:active:not(:disabled){transform:translateY(1px)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
        margin-bottom:10px}
  .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .name{font-weight:640;font-size:16px}
  .desc{color:var(--dim);font-size:13.5px;margin-top:3px}
  .how{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
  .cmdrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cmdrow code{background:var(--code);padding:3px 8px;border-radius:6px;word-break:break-all}
  .how ul{margin:8px 0 6px;padding-left:20px}
  .how li{margin:2px 0}
  pre{margin:8px 0 0;padding:9px 11px;background:var(--code);border-radius:8px;
      white-space:pre-wrap;word-break:break-all;line-height:1.5}
  .status{font-size:13px;margin-top:6px}
  .status.ok{color:var(--ok)}
  .status.bad{color:var(--danger)}
  .status.busy{color:var(--dim)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000c;color:#fff;
         padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;
         pointer-events:none;z-index:9;max-width:90vw;text-align:center}
  #toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>常用操作</h1>
    <span class="hint" id="dir"></span>
  </header>
  <div id="list"></div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2600);
}
async function copy(txt){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); toast('已复制'); return; }
    throw 0;
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove();
    toast(ok?'已复制':'复制失败，手动选中吧');
  }
}

let acts = [];

function render(d){
  acts = d.actions;
  $('#dir').textContent = '脚本都在 ' + d.dir;
  if(!acts.length){
    $('#list').innerHTML = '<p class="hint">脚本目录里还没有带「# 按钮:」的脚本。</p>';
    return;
  }
  let html = '', group = null;
  acts.forEach((a, i) => {
    if(a.group !== group){ group = a.group; html += `<h2>${esc(group)}</h2>`; }
    const manual = (a.manual||[]).map(m=>`<li>${esc(m)}</li>`).join('');
    html += `<div class="card" id="c${i}">
      <div class="top">
        <span class="name">${esc(a.name)}</span><span class="spacer"></span>
        <button class="run ${a.confirm?'danger':''}" data-run="${i}" ${a.running?'disabled':''}>${a.running?'跑着…':'执行'}</button>
        <button data-how="${i}">怎么弄</button>
      </div>
      <div class="desc">${esc(a.desc)}</div>
      <div class="how" hidden>
        <div class="cmdrow"><span>终端里跑：</span><code>${esc(a.cmd)}</code>
          <button class="mini" data-copy="${i}">复制</button></div>
        ${manual?`<ul>${manual}</ul>`:''}
        <button class="mini" data-src="${i}">看脚本</button>
        <pre class="src" hidden></pre>
      </div>
      <pre class="out" hidden></pre>
      <div class="status"></div>
    </div>`;
  });
  $('#list').innerHTML = html;
}

async function load(){
  try{
    const r = await fetch('/api/actions');
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    render(j);
  }catch(e){ $('#list').innerHTML = `<p class="hint">拿不到按钮列表：${esc(e.message)}</p>`; }
}

async function run(i){
  const a = acts[i], card = $('#c'+i);
  const btn = card.querySelector('[data-run]'), out = card.querySelector('.out'), st = card.querySelector('.status');
  if(a.confirm && !confirm(a.confirm)) return;
  btn.disabled = true; btn.textContent = '跑着…';
  out.hidden = false; out.textContent = '';
  st.className = 'status busy'; st.textContent = '跑着…';
  let live = null;  // 进度条那种原地刷新的行
  const add = (t, isCR) => {
    if(!live){ live = document.createTextNode(''); out.appendChild(live); }
    live.textContent = t;
    if(!isCR){ out.appendChild(document.createTextNode('\n')); live = null; }
  };
  try{
    const r = await fetch('/api/run?file='+encodeURIComponent(a.file), {method:'POST', headers:{'X-Ops':'1'}});
    if(!r.ok) throw new Error((await r.text()).trim() || ('HTTP '+r.status));
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '', done = null;
    for(;;){
      const {value, done:end} = await rd.read();
      if(end) break;
      buf += dec.decode(value, {stream:true});
      let k;
      while((k = buf.indexOf('\n\n')) >= 0){
        const chunk = buf.slice(0, k); buf = buf.slice(k+2);
        let ev = 'message', data = '';
        for(const ln of chunk.split('\n')){
          if(ln.startsWith('event: ')) ev = ln.slice(7);
          else if(ln.startsWith('data: ')) data += ln.slice(6);
        }
        const v = JSON.parse(data);
        if(ev === 'line') add(v, false);
        else if(ev === 'cr') add(v, true);
        else if(ev === 'done') done = v;
      }
    }
    if(!done) throw new Error('连接断了，没等到结果');
    const secs = done.secs.toFixed(1);
    if(done.code === 0){ st.className = 'status ok'; st.textContent = `完成，${secs} 秒`; }
    else { st.className = 'status bad'; st.textContent = `失败（退出码 ${done.code}），${secs} 秒`; }
  }catch(e){
    st.className = 'status bad'; st.textContent = '没跑成：' + e.message;
  }
  btn.disabled = false; btn.textContent = '执行';
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.run !== undefined){ run(+b.dataset.run); return; }
  if(b.dataset.how !== undefined){
    const h = $('#c'+b.dataset.how).querySelector('.how'); h.hidden = !h.hidden; return;
  }
  if(b.dataset.copy !== undefined){ copy(acts[+b.dataset.copy].cmd); return; }
  if(b.dataset.src !== undefined){
    const pre = b.nextElementSibling;
    if(!pre.hidden){ pre.hidden = true; b.textContent = '看脚本'; return; }
    try{
      const r = await fetch('/api/source?file='+encodeURIComponent(acts[+b.dataset.src].file));
      pre.textContent = await r.text();
    }catch(err){ pre.textContent = '读不到：' + err.message; }
    pre.hidden = false; b.textContent = '收起脚本';
  }
});

load();
</script>
</body>
</html>
