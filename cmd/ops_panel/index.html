<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>常用操作</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--fg:#1c1f23;--dim:#6b7280;--tile:#f3f5f8;
        --accent:#2f6df6;--ok:#1f9d55;--danger:#d64545;--code:#f1f3f6}
  @media (prefers-color-scheme:dark){
    :root{--bg:#15171a;--card:#1e2126;--line:#2f343b;--fg:#e8eaed;--dim:#9aa2ad;--tile:#262a30;
          --accent:#4b83f7;--ok:#2f9e63;--danger:#d45a5a;--code:#262a30}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);padding:0 0 40px;
       font:15px/1.6 system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:0 14px}
  header{display:flex;align-items:baseline;gap:10px;padding:16px 0 12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:650}
  .hint{color:var(--dim);font-size:13px}
  .spacer{flex:1}
  code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);
         border-radius:8px;padding:5px 13px;cursor:pointer}
  button.mini{padding:1px 9px;font-size:12.5px;border-radius:7px}
  button:disabled{cursor:default}

  /* 一组一块，宽屏几块并排 */
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;min-width:0}
  .group h2{font-size:15px;font-weight:650;margin:0 0 10px}

  /* 组里的按钮排成格子 */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
  .tile{position:relative;min-width:0}
  .act{width:100%;min-height:62px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
       gap:1px;text-align:left;padding:8px 30px 8px 12px;border-radius:10px;background:var(--tile)}
  .act:active:not(:disabled){transform:translateY(1px)}
  .act .nm{font-weight:620;font-size:14.5px;line-height:1.35}
  .act .sub{font-size:12.5px;opacity:.85;line-height:1.3}
  .act.danger{color:var(--danger)}
  .act.tg{color:#fff}
  .act.tg.off{background:var(--ok);border-color:var(--ok)}   /* 没在跑：绿，点了开始 */
  .act.tg.on{background:var(--danger);border-color:var(--danger)}  /* 在跑：红，点了停 */
  .act:disabled{opacity:.6}
  .q{position:absolute;top:6px;right:6px;width:21px;height:21px;padding:0;border-radius:50%;
     font-size:12px;line-height:19px;text-align:center;background:transparent;color:var(--dim);border-color:currentColor;opacity:.75}
  .tile.tg .q{color:#fff}

  /* 怎么弄、输出：在格子下面展开 */
  .how,.out{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
  .how .t,.out .t{font-weight:620}
  .how .desc{color:var(--dim);font-size:13.5px;margin:2px 0 6px}
  .cmdrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
  .cmdrow code{background:var(--code);padding:2px 8px;border-radius:6px;word-break:break-all}
  .how ul{margin:6px 0;padding-left:20px}
  .how li{margin:2px 0}
  .ohead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .st{font-size:13px}
  .st.ok{color:var(--ok)} .st.bad{color:var(--danger)} .st.busy{color:var(--dim)}
  pre{margin:6px 0 0;padding:8px 10px;background:var(--code);border-radius:8px;
      white-space:pre-wrap;word-break:break-all;line-height:1.5}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000c;color:#fff;
         padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;
         pointer-events:none;z-index:9;max-width:90vw;text-align:center}
  #toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>常用操作</h1>
    <span class="hint" id="dir"></span>
  </header>
  <div id="groups" class="groups"></div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const MAX_LINES = 120;  // 输出只留最后这么多行，看广告那种一跑几百行的不至于把页面拉得老长
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2600);
}
async function copy(txt){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); toast('已复制'); return; }
    throw 0;
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove();
    toast(ok?'已复制':'复制失败，手动选中吧');
  }
}

let acts = [], sig = '';
const local = {};   // 按 file：这页上正在开 / 停 / 看进度的状态
const L = f => local[f] || (local[f] = {starting:false, stopping:false, streams:0, lines:[], dropped:0, live:false});
const anyStream = () => Object.values(local).some(s => s.streams > 0);
const signature = list => list.map(a => [a.file,a.name,a.group,a.unit||'',a.confirm||''].join('|')).join('\n');

function render(d){
  acts = d.actions; sig = signature(acts);
  $('#dir').textContent = '脚本都在 ' + d.dir;
  if(!acts.length){ $('#groups').innerHTML = '<p class="hint">脚本目录里还没有带「# 按钮:」的脚本。</p>'; return; }
  const groups = [];
  acts.forEach((a, i) => {
    let g = groups[groups.length-1];
    if(!g || g.name !== a.group){ g = {name:a.group, items:[]}; groups.push(g); }
    g.items.push(i);
  });
  $('#groups').innerHTML = groups.map(g => `<section class="group">
      <h2>${esc(g.name)}</h2>
      <div class="tiles">${g.items.map(i => `<div class="tile${acts[i].unit?' tg':''}" id="t${i}">
          <button class="act" data-act="${i}"><span class="nm">${esc(acts[i].name)}</span><span class="sub"></span></button>
          <button class="q" data-how="${i}" title="怎么弄">?</button>
        </div>`).join('')}</div>
      ${g.items.map(i => howHTML(i)).join('')}
      ${g.items.map(i => `<div class="out" id="o${i}" hidden>
          <div class="ohead"><span class="t">${esc(acts[i].name)}</span><span class="st"></span>
            <span class="spacer"></span><button class="mini" data-close="${i}">收起</button></div>
          <pre></pre></div>`).join('')}
    </section>`).join('');
  acts.forEach((a, i) => paint(i));
}

function howHTML(i){
  const a = acts[i];
  const manual = (a.manual||[]).map(m=>`<li>${esc(m)}</li>`).join('');
  return `<div class="how" id="h${i}" hidden>
    <div class="t">${esc(a.name)}</div>
    <div class="desc">${esc(a.desc)}</div>
    <div class="cmdrow"><span>${a.unit?'终端里开始：':'终端里跑：'}</span><code>${esc(a.cmd)}</code>
      <button class="mini" data-copy="${i}">复制</button></div>
    ${a.unit?`<div class="cmdrow"><span>终端里停：</span><code>${esc(a.stopCmd)}</code>
      <button class="mini" data-copystop="${i}">复制</button></div>`:''}
    ${manual?`<ul>${manual}</ul>`:''}
    <button class="mini" data-src="${i}">看脚本</button>
    <pre class="src" hidden></pre>
  </div>`;
}

// 按钮的颜色和小字跟着状态走
function paint(i){
  const a = acts[i], s = L(a.file), b = $(`#t${i} .act`); if(!b) return;
  const sub = b.querySelector('.sub');
  if(a.unit){
    const stopping = s.stopping || a.stopping;
    b.className = 'act tg ' + (a.on || stopping ? 'on' : 'off');
    b.disabled = stopping || s.starting;
    sub.textContent = stopping ? '停着…' : s.starting ? '开始中…' : a.on ? '在跑 · 点一下停' : '点一下开始';
  }else{
    const busy = s.streams > 0 || a.running;
    b.className = 'act' + (a.confirm ? ' danger' : '');
    b.disabled = busy;
    sub.textContent = busy ? '跑着…' : '';
  }
}

async function load(){
  try{
    const r = await fetch('/api/actions');
    const j = await r.json();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    render(j);
    acts.forEach((a, i) => { if(a.unit && a.on) follow(i); });
  }catch(e){ $('#groups').innerHTML = `<p class="hint">拿不到按钮列表：${esc(e.message)}</p>`; }
}

// 每 3 秒对一下开关在不在跑（页面在后台时不查）
async function refresh(){
  if(document.visibilityState !== 'visible') return;
  let j;
  try{ const r = await fetch('/api/actions'); if(!r.ok) return; j = await r.json(); }catch(e){ return; }
  if(signature(j.actions) !== sig){ if(!anyStream()) { render(j); } return; }
  j.actions.forEach((n, i) => {
    const a = acts[i]; a.on = n.on; a.running = n.running; a.stopping = n.stopping;
    const s = L(a.file);
    if(a.unit && a.on) s.starting = false;
    paint(i);
    if(a.unit && a.on && s.streams === 0 && !s.stopping) follow(i);  // 别处开的（终端、另一个页面）也接上进度
  });
}
setInterval(refresh, 3000);
document.addEventListener('visibilitychange', refresh);

// 往某个按钮的输出框里写一行；isCR＝进度条那种原地刷新
function out(i, t, isCR){
  const s = L(acts[i].file), box = $('#o'+i);
  if(s.live) s.lines[s.lines.length-1] = t; else s.lines.push(t);
  s.live = !!isCR;
  if(s.lines.length > MAX_LINES){ const k = s.lines.length - MAX_LINES; s.lines.splice(0, k); s.dropped += k; }
  box.hidden = false;
  box.querySelector('pre').textContent = (s.dropped ? `（前面还有 ${s.dropped} 行没显示）\n` : '') + s.lines.join('\n');
}
function status(i, cls, txt){ const st = $(`#o${i} .st`); st.className = 'st ' + cls; st.textContent = txt; }

// 跑一趟并把输出推到页面上。op：''＝执行/开始，'stop'＝停，'follow'＝只看进度
async function stream(i, op){
  const a = acts[i], s = L(a.file);
  s.streams++; paint(i);
  let lines = 0;
  if(op !== 'follow'){ $('#o'+i).hidden = false; status(i, 'busy', op === 'stop' ? '停着…' : '跑着…'); }
  try{
    const r = await fetch('/api/run?file='+encodeURIComponent(a.file)+(op?'&op='+op:''), {method:'POST', headers:{'X-Ops':'1'}});
    if(!r.ok) throw new Error((await r.text()).trim() || ('HTTP '+r.status));
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '', done = null;
    for(;;){
      const {value, done:end} = await rd.read();
      if(end) break;
      buf += dec.decode(value, {stream:true});
      let k;
      while((k = buf.indexOf('\n\n')) >= 0){
        const chunk = buf.slice(0, k); buf = buf.slice(k+2);
        let ev = 'message', data = '';
        for(const ln of chunk.split('\n')){
          if(ln.startsWith('event: ')) ev = ln.slice(7);
          else if(ln.startsWith('data: ')) data += ln.slice(6);
        }
        const v = JSON.parse(data);
        if(ev === 'line' || ev === 'cr'){
          if(lines++ === 0 && op === 'follow') status(i, 'busy', '在跑，下面是进度');
          out(i, v, ev === 'cr');
        }
        else if(ev === 'done') done = v;
      }
    }
    if(!done) throw new Error('连接断了，没等到结果');
    if(op === 'follow' && lines === 0) return;   // 没在跑，什么都没看到，不显示
    const secs = done.secs.toFixed(1);
    if(done.code === 0) status(i, 'ok', op === 'follow' ? '这一趟跑完了' : `完成，${secs} 秒`);
    else status(i, 'bad', `失败（退出码 ${done.code}），${secs} 秒`);
  }catch(e){
    if(op !== 'follow'){ status(i, 'bad', '没跑成：' + e.message); $('#o'+i).hidden = false; }
  }finally{
    s.streams--; paint(i);
  }
}
function follow(i){ stream(i, 'follow'); }

async function press(i){
  const a = acts[i], s = L(a.file);
  if(!a.unit){
    if(a.confirm && !confirm(a.confirm)) return;
    s.lines = []; s.dropped = 0; s.live = false;
    await stream(i, '');
    return;
  }
  if(a.on){                       // 在跑 → 停
    s.stopping = true; paint(i);
    out(i, '—— 点了停 ——');
    await stream(i, 'stop');
    s.stopping = false; a.on = false; paint(i);
    refresh();
  }else{                          // 没在跑 → 开始
    s.starting = true; s.lines = []; s.dropped = 0; s.live = false; paint(i);
    setTimeout(refresh, 1500);
    await stream(i, '');
    s.starting = false; paint(i);
    refresh();
  }
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.act !== undefined){ press(+b.dataset.act); return; }
  if(b.dataset.how !== undefined){ const h = $('#h'+b.dataset.how); h.hidden = !h.hidden; return; }
  if(b.dataset.close !== undefined){ $('#o'+b.dataset.close).hidden = true; return; }
  if(b.dataset.copy !== undefined){ copy(acts[+b.dataset.copy].cmd); return; }
  if(b.dataset.copystop !== undefined){ copy(acts[+b.dataset.copystop].stopCmd); return; }
  if(b.dataset.src !== undefined){
    const pre = b.nextElementSibling;
    if(!pre.hidden){ pre.hidden = true; b.textContent = '看脚本'; return; }
    try{
      const r = await fetch('/api/source?file='+encodeURIComponent(acts[+b.dataset.src].file));
      pre.textContent = await r.text();
    }catch(err){ pre.textContent = '读不到：' + err.message; }
    pre.hidden = false; b.textContent = '收起脚本';
  }
});

load();
</script>
</body>
</html>
