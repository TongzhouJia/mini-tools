<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语单词自测</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#fff; --ink:#1c1b19; --dim:#77736c; --line:#e2ded6;
  --accent:#e8eefb; --accent-b:#b9cdf2; --warm:#c2410c; --ok:#15803d; --mark:#ffe9c2;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17181a; --panel:#1f2124; --ink:#e8e6e3; --dim:#8f8b85; --line:#31343a;
    --accent:#242c3d; --accent-b:#3d5480; --warm:#fb923c; --ok:#4ade80; --mark:#4a3410;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.6 "Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button,select{font:inherit;color:inherit}
button{
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:6px 12px; cursor:pointer;
}
button:hover{border-color:var(--dim)}
button:disabled{opacity:.4;cursor:default}
select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 8px}

#bar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;
}
#bar h1{font-size:14px;margin:0;letter-spacing:.5px;font-weight:600}
#bar .sp{flex:1}
#bar .m{font-size:12px;color:var(--dim)}
#track{height:3px;background:var(--line);flex:none}
#track>i{display:block;height:100%;background:var(--accent-b);width:0;transition:width .18s}

#stage{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 8px}
#card{width:100%;max-width:660px;text-align:center}

.tag{
  display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);
  border-radius:99px;padding:2px 10px;margin-bottom:18px;letter-spacing:.4px;
}
.ask{font-size:12px;color:var(--dim);margin-bottom:10px;letter-spacing:.5px}
.term{font-size:38px;line-height:1.25;font-weight:600;word-break:break-word}
.term.zh{font-size:30px}
.pos{font-size:13px;color:var(--dim);margin-top:6px}
.def{font-size:22px;margin-top:14px}

.play{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--accent);border-color:var(--accent-b);
  font-size:16px;padding:13px 26px;border-radius:12px;
}
.play.big{font-size:19px;padding:18px 40px}

#back{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;display:none}
#back.on{display:block}
.sent{
  text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-top:10px;font-size:15px;line-height:1.75;
  display:flex;gap:11px;align-items:flex-start;
}
.sent .go{flex:none;padding:3px 9px;font-size:13px;border-radius:7px}
.sent mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.src{font-size:11px;color:var(--dim);margin-top:5px}
.noaudio{font-size:12px;color:var(--dim);margin-top:12px}

#foot{flex:none;padding:12px 16px 20px;border-top:1px solid var(--line);background:var(--panel);
  display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
#foot button{min-width:112px;padding:11px 14px}
#foot .k{font-size:11px;color:var(--dim);display:block}
#reveal{min-width:220px;background:var(--accent);border-color:var(--accent-b)}
.g1:hover{border-color:var(--warm)} .g3:hover{border-color:var(--ok)}

#done{text-align:center;max-width:520px}
#done h2{font-weight:600;font-size:20px;margin:0 0 6px}
#done .row{display:flex;gap:22px;justify-content:center;margin:20px 0}
#done .n{font-size:30px;font-weight:600}
#done .n small{display:block;font-size:12px;color:var(--dim);font-weight:400}
#splash{text-align:center;max-width:560px}
#splash .grid{display:flex;gap:26px;justify-content:center;margin:22px 0 8px;flex-wrap:wrap}
#splash .n{font-size:26px;font-weight:600}
#splash .n small{display:block;font-size:12px;color:var(--dim);font-weight:400}
#splash p{color:var(--dim);font-size:13px;line-height:1.8}
.hide{display:none!important}
</style>
</head>
<body>

<div id="bar">
  <h1>英语单词自测</h1>
  <select id="tier">
    <option value="core">核心（跨集复现 + 全部短语）</option>
    <option value="extra">边角（只出现过一次的）</option>
    <option value="all">全部</option>
  </select>
  <span class="sp"></span>
  <span class="m" id="counter"></span>
  <span class="m" id="stats"></span>
</div>
<div id="track"><i id="trackbar"></i></div>

<div id="stage">
  <div id="splash">
    <div class="grid" id="splashGrid"></div>
    <p id="splashText"></p>
    <button class="play big" id="start">开始这一轮</button>
  </div>

  <div id="card" class="hide">
    <div class="tag" id="tag"></div>
    <div id="front"></div>
    <div id="back"></div>
  </div>

  <div id="done" class="hide">
    <h2>这一轮完了</h2>
    <div class="row" id="doneRow"></div>
    <button class="play" id="again">再来一轮</button>
  </div>
</div>

<div id="foot" class="hide">
  <button id="reveal">翻面 <span class="k">空格</span></button>
  <button class="g1 hide" id="g1">忘了 <span class="k">1</span></button>
  <button class="hide" id="g2">勉强 <span class="k">2</span></button>
  <button class="g3 hide" id="g3">会 <span class="k">3</span></button>
  <button id="skip">跳过 <span class="k">s</span></button>
</div>

<audio id="au" preload="metadata"></audio>

<script>
const $ = s => document.querySelector(s);
const au = $('#au');
let queue = [], i = 0, shown = false, cur = null, stopAt = 0;
let tally = {1:0, 2:0, 3:0};

// ── 放原句 ──
// 不预切片段：整集 mp3 交给浏览器，跳到那一秒，到点暂停。
// 换集才重设 src，同一集里连着放不会重新缓冲。
function playClip(h){
  if(!h) return;
  const go = () => { try{ au.currentTime = h.start; }catch(e){} stopAt = h.end; au.play().catch(()=>{}); };
  if(au.dataset.ep !== h.ep){
    au.dataset.ep = h.ep;
    au.src = '/audio/' + h.ep;
    au.addEventListener('loadedmetadata', go, {once:true});
    au.load();
  } else go();
}
au.addEventListener('timeupdate', () => {
  if(stopAt && au.currentTime >= stopAt){ au.pause(); stopAt = 0; }
});

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 把原句里那个词圈出来。只按词干粗匹配，圈不中就算了 —— 句子本身才是重点。
function markWord(text, id){
  const stem = id.split(' ').filter(w => w.length > 3).sort((a,b) => b.length - a.length)[0] || id;
  try{
    const re = new RegExp('(' + stem.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\w*)', 'ig');
    return esc(text).replace(re, '<mark>$1</mark>');
  }catch(e){ return esc(text); }
}

const MODE = {
  listen:    '听原句 → 想意思',
  produce:   '中文 → 想英文',
  recognize: '英文 → 想中文',
};

function render(){
  const c = cur;
  $('#tag').textContent = MODE[c.mode] + (c.fresh ? '   · 新词' : (c.prog ? '   · 第 ' + (c.prog.seen + 1) + ' 次' : ''));

  let front = '';
  if(c.mode === 'listen'){
    front = '<div class="ask">这句里那个词，什么意思？</div>' +
            '<button class="play big" id="p0">▶ 放原句 <span style="font-size:12px;color:var(--dim)">r</span></button>';
  }else if(c.mode === 'produce'){
    front = '<div class="ask">英文怎么说？</div><div class="term zh">' + esc(c.def.replace(/^\s*[a-z.\/]+\.\s*/,'')) + '</div>' +
            '<div class="pos">' + esc(c.pos) + '</div>';
  }else{
    front = '<div class="ask">什么意思？</div><div class="term">' + esc(c.word) + '</div>';
  }
  $('#front').innerHTML = front;
  if(c.mode === 'listen') $('#p0').onclick = () => playClip(c.hits[0]);

  let back = '<div class="term">' + esc(c.word) + '</div>' +
             '<div class="def">' + esc(c.def) + '</div>';
  if(c.hits && c.hits.length){
    back += c.hits.map((h, n) =>
      '<div class="sent"><button class="go" data-h="' + n + '">▶</button>' +
      '<div><div>' + markWord(h.text, c.id) + '</div>' +
      '<div class="src">' + esc(EPS[h.ep] ? EPS[h.ep].title : h.ep) + ' · ' + fmt(h.start) + '</div></div></div>').join('');
  }else{
    back += '<div class="noaudio">转录稿里没找着这个词的原句</div>';
  }
  $('#back').innerHTML = back;
  $('#back').querySelectorAll('.go').forEach(b => b.onclick = () => playClip(c.hits[+b.dataset.h]));

  $('#back').classList.remove('on');
  shown = false;
  toggleFoot();
  if(c.mode === 'listen') setTimeout(() => playClip(c.hits[0]), 120);
}

const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');

function toggleFoot(){
  $('#reveal').classList.toggle('hide', shown);
  ['#g1','#g2','#g3'].forEach(s => $(s).classList.toggle('hide', !shown));
}

function reveal(){
  if(shown || !cur) return;
  shown = true;
  $('#back').classList.add('on');
  toggleFoot();
  // 短语是「中文→想英文」，翻面时补一遍原声，让它挂上声音
  if(cur.mode === 'produce' && cur.hits && cur.hits.length) playClip(cur.hits[0]);
}

async function grade(r){
  if(!shown || !cur) return;
  tally[r]++;
  const id = cur.id;
  fetch('/api/grade', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id, rating: r})}).catch(()=>{});
  // 忘了的塞回队尾，本轮还得再撞一次
  if(r === 1) queue.push(Object.assign({}, cur, {prog:null, fresh:false}));
  next();
}

function next(){
  au.pause(); stopAt = 0;
  i++;
  if(i >= queue.length) return finish();
  cur = queue[i];
  $('#counter').textContent = (i+1) + ' / ' + queue.length;
  $('#trackbar').style.width = (100*i/queue.length) + '%';
  render();
}

function finish(){
  $('#card').classList.add('hide');
  $('#foot').classList.add('hide');
  $('#trackbar').style.width = '100%';
  $('#doneRow').innerHTML =
    '<div class="n">' + tally[3] + '<small>会</small></div>' +
    '<div class="n">' + tally[2] + '<small>勉强</small></div>' +
    '<div class="n">' + tally[1] + '<small>忘了</small></div>';
  $('#done').classList.remove('hide');
}

let EPS = {};

async function load(){
  const tier = $('#tier').value;
  const r = await fetch('/api/session?tier=' + tier);
  const d = await r.json();
  EPS = d.eps || {};
  queue = (d.items || []).map(x => Object.assign({}, x, x.card));
  const s = d.stats;
  $('#stats').textContent = '到期 ' + s.due + ' · 没见过 ' + s.fresh + ' · 已开 ' + s.started;
  $('#splashGrid').innerHTML =
    '<div class="n">' + queue.length + '<small>这一轮</small></div>' +
    '<div class="n">' + s.due + '<small>今天到期</small></div>' +
    '<div class="n">' + s.fresh + '<small>还没见过</small></div>' +
    '<div class="n">' + s.core + '<small>核心词</small></div>';
  $('#splashText').innerHTML =
    '单词表一共 ' + s.total + ' 个词，其中 ' + s.extra + ' 个只在某一集里出现过一次（学科名词居多），默认不刷。<br>' +
    s.audio + ' 个词挂上了播客原声 —— 那批走「听原句 → 想意思」。';
  return d;
}

async function begin(){
  await load();
  tally = {1:0,2:0,3:0};
  if(!queue.length){
    $('#splashText').innerHTML = '这一档今天没有到期的，也没有新词了。换个档位，或者明天再来。';
    return;
  }
  $('#splash').classList.add('hide');
  $('#done').classList.add('hide');
  $('#card').classList.remove('hide');
  $('#foot').classList.remove('hide');
  i = -1;
  next();
}

$('#start').onclick = begin;
$('#again').onclick = begin;
$('#reveal').onclick = reveal;
$('#g1').onclick = () => grade(1);
$('#g2').onclick = () => grade(2);
$('#g3').onclick = () => grade(3);
$('#skip').onclick = () => { if(cur) next(); };
$('#tier').onchange = () => { $('#card').classList.add('hide'); $('#done').classList.add('hide');
  $('#splash').classList.remove('hide'); $('#foot').classList.add('hide'); load(); };

addEventListener('keydown', e => {
  if(e.target.tagName === 'SELECT') return;
  if(e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if($('#splash').classList.contains('hide') === false) return begin();
    if($('#done').classList.contains('hide') === false) return begin();
    reveal();
  }
  else if(e.key === '1') grade(1);
  else if(e.key === '2') grade(2);
  else if(e.key === '3') grade(3);
  else if(e.key === 'r' && cur && cur.hits && cur.hits.length) playClip(cur.hits[0]);
  else if(e.key === 's' && cur) next();
});

load();
</script>
</body>
</html>
