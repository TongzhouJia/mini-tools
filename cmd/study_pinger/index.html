<!doctype html>
<meta charset="utf-8">
<title>起来动一下</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font: 16px/1.7 system-ui, "Noto Sans CJK SC", sans-serif;
    max-width: 480px; margin: 8vh auto; padding: 0 20px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { opacity: .6; font-size: 14px; margin-bottom: 28px; }
  .big { font-size: 46px; font-weight: 700; letter-spacing: -1px; margin: 6px 0; }
  .row { display: flex; justify-content: space-between; padding: 9px 0;
         border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent); }
  .row span:last-child { opacity: .75; }
  .off { color: #c0392b; }
  .note { margin-top: 26px; font-size: 13px; opacity: .55; }
</style>

<h1>起来动一下</h1>
<div class="sub">每半小时提醒一次。不记录任何数据。</div>

<div id="countdown" class="big">…</div>
<div class="sub" id="nextAt"></div>

<div class="row"><span>间隔</span><span id="every">—</span></div>
<div class="row"><span>活动时段</span><span id="hours">—</span></div>
<div class="row"><span>此刻在时段内</span><span id="inwin">—</span></div>
<div class="row"><span>本次运行已提醒</span><span id="count">—</span></div>
<div class="row"><span>启动于</span><span id="started">—</span></div>

<div class="note">
  为什么是 30 分钟：坐位时腰椎间盘承受的压力比站着高四成左右，
  所以要打断的是「连续坐」，不是「学习」。
</div>

<script>
let next = null;
function hhmm(d) { return d.toTimeString().slice(0, 5); }

async function load() {
  try {
    const s = await (await fetch('/api/status')).json();
    next = s.next_ping ? new Date(s.next_ping) : null;
    document.getElementById('every').textContent = s.every_min + ' 分钟';
    document.getElementById('hours').textContent = s.hours;
    const w = document.getElementById('inwin');
    w.textContent = s.in_window ? '是' : '否（不打扰）';
    w.className = s.in_window ? '' : 'off';
    document.getElementById('count').textContent = s.count + ' 次';
    document.getElementById('started').textContent = hhmm(new Date(s.started_at));
    document.getElementById('nextAt').textContent =
      next ? '下一次 ' + hhmm(next) : '';
  } catch (e) {
    document.getElementById('countdown').textContent = '连不上';
    document.getElementById('nextAt').textContent = '提醒器没在跑？';
  }
}

function tick() {
  if (!next) return;
  const left = Math.max(0, Math.round((next - Date.now()) / 1000));
  const m = String(Math.floor(left / 60)).padStart(2, '0');
  const s = String(left % 60).padStart(2, '0');
  document.getElementById('countdown').textContent = m + ':' + s;
  if (left <= 0) load();
}

load();
setInterval(tick, 1000);
setInterval(load, 60000);
</script>
