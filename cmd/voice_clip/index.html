<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<title>语音进剪贴板</title>
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --line: #e5e7eb; --faint: #9ca3af;
    --blue: #2563eb; --green: #15803d;
    --ok-bg: #dcfce7; --ok: #15803d; --err-bg: #fee2e2; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c; --fg: #e8eaed; --line: #2c3037; --faint: #6b7280;
      --blue: #3b6fd4; --green: #2f7d4f;
      --ok-bg: rgba(74,222,128,.15); --ok: #4ade80;
      --err-bg: rgba(248,113,113,.15); --err: #f87171;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    height: 100dvh;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, "Noto Sans CJK SC", sans-serif;
  }

  #taskList {
    flex: none; margin: 8px 10px 0;
    font: 14px/1 inherit;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 8px; outline: none;
  }

  textarea {
    flex: none; width: 100%; height: 40dvh;
    margin: 8px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    border: none; background: none; color: var(--fg);
    font: 18px/1.65 inherit;
    resize: none; outline: none;
  }
  textarea::placeholder { color: var(--faint); }

  .btns {
    flex: none; display: flex; gap: 8px;
    padding: 8px 10px 0;
  }
  .btns button {
    flex: 1; padding: 18px 0;
    font: 600 17px/1 inherit; color: #fff;
    border: none; border-radius: 12px; cursor: pointer;
  }
  .btns button:active { opacity: .8; }
  .btns button:disabled { opacity: .5; }
  #send { background: var(--blue); }
  #task { background: var(--green); }

  .filler { flex: 1; }

  #msg {
    position: fixed; left: 50%; top: 12px; transform: translate(-50%, -160%);
    max-width: calc(100vw - 24px);
    padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: transform .25s, opacity .25s;
    z-index: 20;
  }
  #msg.show { transform: translate(-50%, 0); opacity: 1; }
  #msg.ok  { background: var(--ok-bg);  color: var(--ok); }
  #msg.err { background: var(--err-bg); color: var(--err); }

  /* 只有在电脑上打开才显示，给手机扫 */
  #qr { display: none; text-align: center; padding: 16px; }
  #qr img { width: 200px; height: 200px; background: #fff; padding: 8px; border-radius: 8px; }
  #qr div { margin-top: 8px; font-size: 14px; color: var(--faint); }
</style>
</head>
<body>

<div id="qr"></div>
<select id="taskList" title="提醒事项写进哪个列表"></select>
<textarea id="text" placeholder="说一段话" enterkeyhint="send" autofocus></textarea>
<div class="btns">
  <button id="send">发送到电脑</button>
  <button id="task">提醒事项</button>
</div>
<div class="filler"></div>
<div id="msg"></div>

<script>
const $ = s => document.querySelector(s);
const ta = $('#text'), sendBtn = $('#send'), taskBtn = $('#task'),
      listSel = $('#taskList'), msgEl = $('#msg');
let busy = false, msgTimer = null;

function say(text, kind) {
  msgEl.textContent = text;
  msgEl.className = kind + ' show';
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { msgEl.className = kind; }, kind === 'err' ? 4000 : 2000);
}
function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

// 两个按钮走同一条路：先清空输入框，失败了再把话放回来
async function submit(kind) {
  const text = ta.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = taskBtn.disabled = true;
  ta.value = '';
  try {
    if (kind === 'clip') {
      await post('/api/send', { text });
      say('已进电脑剪贴板', 'ok');
    } else {
      await post('/api/task', { text, list: listSel.value });
      say('已存进「' + listSel.value + '」', 'ok');
    }
    buzz(30);
  } catch (e) {
    ta.value = text;
    say(e.message, 'err');
    buzz([20, 60, 20]);
  } finally {
    busy = false;
    sendBtn.disabled = taskBtn.disabled = false;
    ta.focus();
  }
}

sendBtn.addEventListener('click', () => submit('clip'));
taskBtn.addEventListener('click', () => submit('task'));

// 回车发到电脑；拼音组字中的回车是上屏，要放过去
ta.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.isComposing || e.keyCode === 229 || e.shiftKey) return;
  e.preventDefault();
  submit('clip');
});

// 点页面任何地方都聚焦到输入框（手机不点就不弹键盘）
document.addEventListener('pointerdown', e => {
  if (e.target.closest('button, select')) return;
  if (e.target !== ta) ta.focus();
});

(async function loadLists() {
  try {
    const r = await fetch('/api/lists');
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    const saved = localStorage.getItem('voiceclip_list');
    for (const name of j.lists) {
      const o = document.createElement('option');
      o.value = o.textContent = name;
      listSel.appendChild(o);
    }
    const want = j.lists.includes(saved) ? saved : j.default;
    if (j.lists.includes(want)) listSel.value = want;
  } catch (e) {
    listSel.innerHTML = '<option>列表没加载出来</option>';
    listSel.disabled = taskBtn.disabled = true;
  }
})();

listSel.addEventListener('change',
  () => localStorage.setItem('voiceclip_list', listSel.value));

// 电脑上打开时显示二维码给手机扫
(async function maybeQR() {
  const h = location.hostname;
  if (h !== '127.0.0.1' && h !== 'localhost') return;
  try {
    const j = await (await fetch('/api/lan')).json();
    if (!j.urls || !j.urls.length) return;
    const box = $('#qr'), url = j.urls[0];
    box.style.display = 'block';
    const img = document.createElement('img');
    img.src = '/api/qr?size=400&data=' + encodeURIComponent(url);
    const cap = document.createElement('div');
    cap.textContent = url;
    box.appendChild(img); box.appendChild(cap);
  } catch (e) {}
})();

ta.focus();
</script>
</body>
</html>
