<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📝 上下文单词本</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --fg: #1c1b19; --muted: #6b6864;
    --line: #d8d3ca; --accent: #b4530a; --sel: #cfe4ff; --sel-line: #2f6fb8;
    --mark: #ffe08a; --mark2: #ffc44d; --mark-line: #e0a300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16151a; --card: #201f26; --fg: #ece9e3; --muted: #979390;
      --line: #3d3a45; --accent: #ffa458; --sel: #24405e; --sel-line: #63a4e8;
      --mark: #6a4a00; --mark2: #8d6300; --mark-line: #d19b28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 system-ui, "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sp { flex: 1; }
  a { color: var(--accent); }
  .wrap {
    display: grid; grid-template-columns: minmax(0,1.05fr) minmax(0,1fr);
    gap: 18px; padding: 18px 20px 60px; max-width: 1500px; margin: 0 auto;
  }
  @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  textarea, input {
    width: 100%; background: transparent; color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
    font: inherit; outline: none;
  }
  textarea { min-height: 82px; resize: vertical; }
  textarea:focus, input:focus { border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 15px; font: inherit; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12.5px; }

  /* ── 可点的句子：词本身 + 词下面那根条 ───────────────── */
  #canvas { margin: 14px 0 2px; font-size: 19px; line-height: 2.5; min-height: 46px; }
  #canvas .ph { color: var(--muted); font-size: 15px; }
  .tk { position: relative; display: inline-block; padding-bottom: 13px; white-space: pre; }
  .w { cursor: pointer; border-radius: 5px; padding: 1px 2px; }
  .w:hover { background: var(--line); }
  .w.sel { background: var(--sel); box-shadow: inset 0 -2px 0 var(--sel-line); }
  .w.m1 { background: var(--mark); box-shadow: inset 0 -2px 0 var(--mark-line); }
  .w.m2 { background: var(--mark2); box-shadow: inset 0 -2px 0 var(--mark-line); } /* 被两条以上盖住 */
  .w.sel.m1, .w.sel.m2 { background: var(--sel); }
  /* 条：命中区域高一点好点，可见的线用 ::after 画 */
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 13px; cursor: pointer; }
  .bar::after {
    content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 3px;
    border-radius: 2px; background: var(--line);
  }
  .bar:hover::after { background: var(--muted); }
  .bar.mk::after { background: var(--mark-line); height: 4px; top: 4px; }
  .bar.on::after { background: var(--sel-line); height: 4px; top: 4px; }

  /* ── 圈中的词 ───────────────────────────────────────── */
  .marks { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .mark {
    display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.25fr) auto;
    gap: 8px; align-items: center;
  }
  .mark input { padding: 6px 9px; }
  .mark input.phrase { border-color: var(--mark-line); }
  .mark .del { background: transparent; color: var(--muted); border: 0; padding: 4px 6px; font-size: 16px; line-height: 1; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

  /* ── 列表 ───────────────────────────────────────────── */
  .entry { border-top: 1px solid var(--line); padding: 13px 0; }
  .entry:first-child { border-top: 0; padding-top: 2px; }
  .entry .sent { font-size: 16px; line-height: 1.85; }
  .hl { background: var(--mark); box-shadow: inset 0 -2px 0 var(--mark-line); border-radius: 4px; }
  .hl2 { background: var(--mark2); box-shadow: inset 0 -2px 0 var(--mark-line); border-radius: 4px; }
  .entry .zh { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
  .entry .defs { margin-top: 6px; font-size: 13.5px; }
  .entry .defs b { font-weight: 600; }
  .entry .meta { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .entry .meta button { background: transparent; color: var(--muted); border: 0; padding: 0; font-size: 12px; }
  .entry .meta button:hover { color: var(--accent); text-decoration: underline; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 20px;
    font-size: 13.5px; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.show { opacity: .94; }
</style>
</head>
<body>

<header>
  <h1>📝 上下文单词本</h1>
  <span class="hint" id="stat"></span>
  <span class="sp"></span>
  <input id="q" placeholder="搜句子 / 词 / 释义" style="width: 220px;">
  <button class="ghost" id="btnImport" title="把 Google Tasks「单词积累」列表里的词拉进来">从 Task 导入</button>
  <button class="ghost" id="btnExport" title="把本子里还没同步的词推到 Google Tasks（存词时本来就会自动推，这个是补漏的）">导出到 Task</button>
  <a href="/api/export.csv" download>导出 CSV</a>
  <a href="/api/export.csv?full=1" download>带例句</a>
</header>

<div class="wrap">
  <div>
    <div class="card">
      <h2>① 粘句子</h2>
      <textarea id="sentence" placeholder="把整句粘进来，比如：She looked forward to the trip with a mixture of excitement and dread."></textarea>

      <h2 style="margin-top:14px">② 选词<span class="hint" style="font-weight:400">　单词点词本身　·　词组点词下面那根条（连着几根就是一个词组）</span></h2>
      <div id="canvas"><span class="ph">上面粘句子，这里就能点了</span></div>

      <div style="margin-top:10px" class="row">
        <button id="btnAdd">加入并翻译</button>
        <span class="hint" id="selInfo"></span>
      </div>

      <h2 style="margin-top:16px">③ 收进来的词</h2>
      <div class="marks" id="marks"><div class="empty">还没选词</div></div>

      <div style="margin-top:14px" class="row">
        <input id="trans" placeholder="整句意思（可留空）" style="flex:1 1 260px">
        <button class="ghost" id="btnTransAll">翻译整句</button>
      </div>

      <div style="margin-top:14px" class="row">
        <button id="btnSave">保存　<span class="hint" style="color:#fff;opacity:.75">Enter</span></button>
        <button class="ghost" id="btnClear">清空</button>
        <span class="hint" id="editing"></span>
      </div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>已存的句子</h2>
      <div id="list"><div class="empty">还没有。左边存第一条吧。</div></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let words = [];           // 切出来的词：{s, e, tail}，tail 是词后面紧跟的空白（让条连起来）
let selWords = new Set(); // 单独选中的词（下标）
let selBars  = new Set(); // 条被点亮的词（下标），连着的一段 = 一个词组
let marks = [];           // 已经收进来的：{start, end, text, lemma, zh}，允许互相重叠
let editingId = "";
let noKeyWarned = false;

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ── 切词 ─────────────────────────────────────────────────
   用 Unicode 属性匹配，重音字母不会被切开；词内的 ' 和 - 留着（don't、well-known）*/
const WORD_RE = /[\p{L}\p{M}][\p{L}\p{M}'’\-]*/gu;

// segs：按顺序的片段，word 的带 wi（第几个词）
function segment(text) {
  const segs = [], ws = [];
  let last = 0, m;
  WORD_RE.lastIndex = 0;
  while ((m = WORD_RE.exec(text)) !== null) {
    if (m.index > last) segs.push({ word: false, s: last, e: m.index });
    // 词后面紧跟的横向空白算进这个词的格子，这样相邻两根条能连成一条线
    let te = m.index + m[0].length;
    while (te < text.length && (text[te] === " " || text[te] === "\t")) te++;
    const wi = ws.length;
    ws.push({ s: m.index, e: m.index + m[0].length, tailEnd: te });
    segs.push({ word: true, wi, s: m.index, e: te });
    last = te;
  }
  if (last < text.length) segs.push({ word: false, s: last, e: text.length });
  words = ws;
  return segs;
}

/* ── 画句子 ──────────────────────────────────────────── */
// 盖住第 i 个词的 mark 有几条（用来分 m1 / m2 两档底色）
function depthAt(i) {
  const w = words[i];
  return marks.filter(k => w.s >= k.start && w.e <= k.end).length;
}
// 这个词是不是某个「跨多个词」的 mark 的一部分——是就把条画成黄的，词组一眼看得出
function inPhrase(i) {
  const w = words[i];
  return marks.some(k => w.s >= k.start && w.e <= k.end && (k.end - k.start) > (w.e - w.s));
}

function renderCanvas() {
  const text = $("#sentence").value;
  const box = $("#canvas");
  if (!text.trim()) { words = []; box.innerHTML = '<span class="ph">上面粘句子，这里就能点了</span>'; return; }

  let html = "";
  for (const sg of segment(text)) {
    if (!sg.word) {
      html += esc(text.slice(sg.s, sg.e)).replace(/\n/g, "<br>");
      continue;
    }
    const w = words[sg.wi];
    const d = depthAt(sg.wi);
    const cls = ["w"];
    if (selWords.has(sg.wi)) cls.push("sel");
    if (d === 1) cls.push("m1"); else if (d > 1) cls.push("m2");
    const barCls = ["bar"];
    if (selBars.has(sg.wi)) barCls.push("on"); else if (inPhrase(sg.wi)) barCls.push("mk");
    html += `<span class="tk" data-i="${sg.wi}">` +
              `<span class="${cls.join(" ")}" data-w="${sg.wi}">${esc(text.slice(w.s, w.e))}</span>` +
              esc(text.slice(w.e, w.tailEnd)) +
              `<span class="${barCls.join(" ")}" data-b="${sg.wi}"></span>` +
            `</span>`;
  }
  box.innerHTML = html;
  renderSelInfo();
}

function renderSelInfo() {
  const runs = barRuns();
  const bits = [];
  if (selWords.size) bits.push(`${selWords.size} 个单词`);
  if (runs.length) bits.push(`${runs.length} 个词组`);
  $("#selInfo").textContent = bits.length ? "待加入：" + bits.join(" + ") : "点词 / 点条来选";
}

// 连着的条 = 一个词组。下标连续就算连着（中间隔着标点也算，比如 "as a result,"）
function barRuns() {
  const idx = [...selBars].sort((a, b) => a - b);
  const runs = [];
  for (const i of idx) {
    const last = runs[runs.length - 1];
    if (last && i === last[last.length - 1] + 1) last.push(i);
    else runs.push([i]);
  }
  return runs;
}

$("#canvas").addEventListener("click", ev => {
  const bar = ev.target.closest(".bar");
  if (bar) {
    const i = +bar.dataset.b;
    selBars.has(i) ? selBars.delete(i) : selBars.add(i);
    renderCanvas();
    return;
  }
  const w = ev.target.closest(".w");
  if (w) {
    const i = +w.dataset.w;
    selWords.has(i) ? selWords.delete(i) : selWords.add(i);
    renderCanvas();
  }
});

/* ── 加入并翻译 ───────────────────────────────────────── */
async function addSelection() {
  const text = $("#sentence").value;
  if (!selWords.size && !selBars.size) return toast("❌ 还没选词");

  const wanted = [];
  for (const i of [...selWords].sort((a, b) => a - b)) {
    wanted.push({ start: words[i].s, end: words[i].e });
  }
  for (const run of barRuns()) {
    wanted.push({ start: words[run[0]].s, end: words[run[run.length - 1]].e });
  }

  const fresh = [];
  let dup = 0;
  for (const r of wanted) {
    // 同一段范围已经收过就跳过；但「单词」和「含它的词组」范围不同，两条都留 —— 这是要的
    if (marks.some(k => k.start === r.start && k.end === r.end)) { dup++; continue; }
    const mk = { start: r.start, end: r.end, text: text.slice(r.start, r.end), lemma: "", zh: "" };
    marks.push(mk);
    fresh.push(mk);
  }
  marks.sort((a, b) => a.start - b.start || b.end - a.end);
  selWords.clear();
  selBars.clear();
  renderAll();

  if (dup) toast(`⏭️ ${dup} 个已经收过了`);
  if (!fresh.length) return;

  const btn = $("#btnAdd");
  btn.disabled = true; btn.textContent = "⏳ 翻译中";
  await Promise.all(fresh.map(translateMark));
  btn.disabled = false; btn.textContent = "加入并翻译";
  renderMarks();
}

async function translateMark(mk) {
  const word = (mk.lemma || mk.text).trim();
  if (!word || mk.zh) return;
  try {
    const r = await fetch("/api/translate?text=" + encodeURIComponent(word));
    if (!r.ok) {
      if (!noKeyWarned) { noKeyWarned = true; toast("⚠️ 自动翻译不可用：" + (await r.text()).trim()); }
      return;
    }
    const d = await r.json();
    if (marks.includes(mk) && !mk.zh) mk.zh = d.text;
  } catch (e) { /* 网络抽风就手填，不打扰 */ }
}

$("#btnAdd").addEventListener("click", addSelection);

/* ── 收进来的词：词形 + 释义都可改 ─────────────────────── */
function renderMarks() {
  const box = $("#marks");
  if (!marks.length) { box.innerHTML = '<div class="empty">还没选词</div>'; return; }
  box.innerHTML = marks.map((k, i) => {
    const isPhrase = /[\s\p{P}]/u.test(k.text.trim());
    return `<div class="mark">
      <input class="${isPhrase ? "phrase" : ""}" data-i="${i}" data-f="lemma"
             value="${esc(k.lemma || k.text)}" placeholder="词形">
      <input data-i="${i}" data-f="zh" value="${esc(k.zh)}" placeholder="中文释义">
      <button class="del" data-i="${i}" title="去掉">✕</button>
    </div>`;
  }).join("");
}

$("#marks").addEventListener("input", ev => {
  const i = ev.target.dataset.i;
  if (i === undefined) return;
  marks[+i][ev.target.dataset.f] = ev.target.value;
});

$("#marks").addEventListener("click", ev => {
  const b = ev.target.closest(".del");
  if (!b) return;
  marks.splice(+b.dataset.i, 1);
  renderAll();
});

function renderAll() { renderCanvas(); renderMarks(); }

$("#btnTransAll").addEventListener("click", async () => {
  const text = $("#sentence").value.trim();
  if (!text) return;
  const b = $("#btnTransAll");
  b.disabled = true; b.textContent = "⏳ 翻译中";
  try {
    const r = await fetch("/api/translate?text=" + encodeURIComponent(text));
    if (!r.ok) throw new Error((await r.text()).trim());
    $("#trans").value = (await r.json()).text;
  } catch (e) { toast("❌ " + e.message); }
  b.disabled = false; b.textContent = "翻译整句";
});

/* ── 存 / 清空 ───────────────────────────────────────── */
async function save() {
  const sentence = $("#sentence").value.trim();
  if (!sentence) return toast("❌ 句子是空的");
  if (!marks.length) return toast("❌ 一个词都没收进来");

  const body = {
    id: editingId,
    sentence,
    trans: $("#trans").value.trim(),
    marks: marks.map(k => ({
      text: k.text, lemma: (k.lemma || "").trim(), zh: (k.zh || "").trim(),
      start: k.start, end: k.end,
    })),
  };
  const r = await fetch("/api/entries", {
    method: editingId ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) return toast("❌ " + (await r.text()).trim());
  toast(editingId ? "✅ 改好了" : `✅ 存了 ${marks.length} 条`);
  clearForm();
  load();
}

function clearForm() {
  editingId = "";
  marks = [];
  selWords.clear();
  selBars.clear();
  $("#sentence").value = ""; $("#trans").value = "";
  lastText = "";
  $("#editing").textContent = "";
  renderAll();
  $("#sentence").focus();
}

$("#btnSave").addEventListener("click", save);
$("#btnClear").addEventListener("click", clearForm);

// Enter：有待加入的选择就先加入，否则保存。shift+Enter 不管（textarea 自带换行）。
// isComposing / 229 要挡住，不然 fcitx5 选词按的那下回车会被当成提交。
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" || ev.shiftKey || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.isComposing || ev.keyCode === 229) return;
  ev.preventDefault();
  if (selWords.size || selBars.size) addSelection(); else save();
});

// 句子被改过，原来的下标就作废了，清掉重选
let lastText = "";
$("#sentence").addEventListener("input", () => {
  if ($("#sentence").value !== lastText) {
    lastText = $("#sentence").value;
    marks = []; selWords.clear(); selBars.clear();
  }
  renderAll();
});

/* ── 列表 ────────────────────────────────────────────── */
// 逐字数「被几条 mark 盖住」，所以单词和词组重叠时两层都看得见
function highlight(sentence, ms) {
  const n = sentence.length;
  const depth = new Array(n).fill(0);
  for (const k of ms) {
    if (!(k.end > k.start) || k.start < 0 || k.end > n) continue; // 句子改过、下标对不上就跳过
    for (let i = k.start; i < k.end; i++) depth[i]++;
  }
  let out = "", i = 0;
  while (i < n) {
    let j = i;
    while (j < n && depth[j] === depth[i]) j++;
    const chunk = esc(sentence.slice(i, j)).replace(/\n/g, "<br>");
    out += depth[i] === 0 ? chunk
         : `<span class="${depth[i] === 1 ? "hl" : "hl2"}">${chunk}</span>`;
    i = j;
  }
  return out;
}

let cache = [];

async function load() {
  const q = $("#q").value.trim();
  const r = await fetch("/api/entries?q=" + encodeURIComponent(q));
  cache = await r.json() || [];
  const ws = new Set();
  cache.forEach(e => e.marks.forEach(k => ws.add(((k.lemma || k.text) || "").toLowerCase())));
  $("#stat").textContent = `${cache.length} 句 · ${ws.size} 条词`;

  const box = $("#list");
  if (!cache.length) {
    box.innerHTML = '<div class="empty">' + (q ? "没搜到。" : "还没有。左边存第一条吧。") + "</div>";
    return;
  }
  box.innerHTML = cache.map(e => {
    const defs = e.marks.map(k =>
      `<b>${esc(k.lemma || k.text)}</b>${k.zh ? " " + esc(k.zh) : ""}`).join(" · ");
    return `<div class="entry">
      <div class="sent">${highlight(e.sentence, e.marks)}</div>
      ${e.trans ? `<div class="zh">${esc(e.trans)}</div>` : ""}
      <div class="defs">${defs}</div>
      <div class="meta">
        <span>${(e.created_at || "").slice(0, 10)}</span>
        <button data-edit="${e.id}">编辑</button>
        <button data-del="${e.id}">删除</button>
      </div>
    </div>`;
  }).join("");
}

$("#list").addEventListener("click", async ev => {
  const ed = ev.target.dataset.edit, dl = ev.target.dataset.del;
  if (ed) {
    const e = cache.find(x => x.id === ed);
    if (!e) return;
    editingId = e.id;
    $("#sentence").value = lastText = e.sentence;
    $("#trans").value = e.trans || "";
    marks = e.marks.map(k => ({ ...k }));
    selWords.clear(); selBars.clear();
    $("#editing").textContent = "正在编辑已存的这条";
    renderAll();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  if (dl) {
    if (!confirm("删掉这条？")) return;
    const r = await fetch("/api/entries?id=" + encodeURIComponent(dl), { method: "DELETE" });
    if (!r.ok) return toast("❌ " + (await r.text()).trim());
    if (editingId === dl) clearForm();
    toast("🗑️ 删了");
    load();
  }
});

let qt;
$("#q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(load, 180); });

// 跟 Google Tasks 的「单词积累」两个方向都能对：
// 导入 = 手机上随手记的词拉进来；导出 = 本子里的词推过去（存词时会自动推，这个补漏）。
// 两边都按词查重，反复点不会推出一堆重复。
async function syncTasks(btn, label, url, describe) {
  const b = $(btn), old = b.textContent;
  b.disabled = true; b.textContent = label;
  try {
    const r = await fetch(url, { method: "POST" });
    const txt = await r.text();
    if (!r.ok) throw new Error(txt.trim());
    toast(describe(JSON.parse(txt)));
    load();
  } catch (e) {
    toast(old + "失败：" + e.message);
  } finally {
    b.disabled = false; b.textContent = old;
  }
}

$("#btnImport").addEventListener("click", () =>
  syncTasks("#btnImport", "导入中…", "/api/import-tasks", d => {
    let msg = d.added ? `导入 ${d.added} 个新词` : "没有新词";
    if (d.updated) msg += `，更新 ${d.updated} 个`;
    if (d.skipped && d.skipped.length) msg += `，跳过 ${d.skipped.length} 个（${d.skipped[0]}）`;
    return msg;
  }));

$("#btnExport").addEventListener("click", () =>
  syncTasks("#btnExport", "导出中…", "/api/export-tasks", d =>
    d.pushed ? `推了 ${d.pushed} 个词到 Task` : `没什么可推的（${d.skipped} 个都已经在了）`));

renderAll();
load();
$("#sentence").focus();
</script>
</body>
</html>
