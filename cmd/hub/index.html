<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>总入口</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e3e6ea;--fg:#1c1f23;--dim:#6b7280;
        --accent:#2f6df6;--ok:#1f9d55;--off:#b9bfc7;--danger:#d64545}
  @media (prefers-color-scheme:dark){
    :root{--bg:#15171a;--card:#1e2126;--line:#2f343b;--fg:#e8eaed;--dim:#9aa2ad;
          --accent:#4b83f7;--ok:#4cc38a;--off:#565d66;--danger:#e56b6b}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);padding:0 0 40px;
       font:15px/1.6 system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:0 14px}
  header{display:flex;align-items:baseline;gap:10px;padding:16px 0 6px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;font-weight:650}
  h2{font-size:14px;font-weight:600;color:var(--dim);margin:22px 0 8px}
  .spacer{flex:1}
  .hint{color:var(--dim);font-size:13px}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);
         border-radius:8px;padding:6px 12px;cursor:pointer}
  button.mini{padding:3px 9px;font-size:12.5px;border-radius:7px}
  button:active{transform:translateY(1px)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
        display:flex;flex-direction:column;gap:2px}
  .card.dead{opacity:.72}
  .card.blocked{opacity:.45}
  .top{display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--off);flex:none}
  .dot.on{background:var(--ok)}
  .name{font-weight:640;font-size:16px}
  .name a{color:inherit;text-decoration:none}
  .name a:hover{color:var(--accent);text-decoration:underline}
  .port{color:var(--dim);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .desc{color:var(--dim);font-size:13px;margin-top:2px}
  .acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .tag{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:0 7px}
  .repo{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
        border-radius:10px;padding:8px 11px;margin-bottom:7px;flex-wrap:wrap}
  .repo code{font-size:12.5px;color:var(--dim);font-family:ui-monospace,Menlo,Consolas,monospace;
             word-break:break-all}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000c;color:#fff;
         padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;
         pointer-events:none;z-index:9;max-width:90vw;text-align:center}
  #toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>总入口</h1>
    <span class="hint" id="sum"></span>
    <span class="spacer"></span>
    <button class="mini" id="refresh">刷新</button>
  </header>

  <div class="grid" id="grid"></div>

  <h2>项目目录（点一下复制路径）</h2>
  <div id="repos"></div>
  <p class="hint" id="foot"></p>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const onPhone = !['127.0.0.1','localhost','::1'].includes(location.hostname);

function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2600);
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function copy(txt){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(txt); toast('已复制'); return; }
    throw 0;
  }catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok=document.execCommand('copy'); ta.remove();
    toast(ok?'已复制':'复制失败，手动选中吧');
  }
}
async function api(p, body){
  const r = await fetch(p, body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  const j = await r.json().catch(()=>({error:'服务端没回 JSON'}));
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}

function url(s){ return 'http://' + location.hostname + ':' + s.port + (s.path || '/'); }

function render(d){
  const svcs = d.services;
  $('#sum').textContent = svcs.filter(s=>s.alive).length + ' / ' + svcs.length + ' 个活着';
  $('#grid').innerHTML = svcs.map(s => {
    const blocked = onPhone && !s.lan;
    const link = blocked
      ? `<span class="name">${esc(s.name)}</span>`
      : `<span class="name"><a href="${url(s)}" target="_blank" rel="noopener">${esc(s.name)}</a></span>`;
    let tags = '';
    if(s.lan) tags += '<span class="tag">手机可用</span>';
    if(s.enabled === 'enabled') tags += '<span class="tag">开机自启</span>';
    if(blocked) tags += '<span class="tag">只能在电脑上开</span>';
    let acts = '';
    if(!blocked){
      acts += `<button class="mini" data-open="${s.id}">打开</button>`;
      if(s.managed){
        acts += s.alive
          ? `<button class="mini" data-act="restart" data-id="${s.id}">重启</button>
             <button class="mini" data-act="stop" data-id="${s.id}">停止</button>`
          : `<button class="mini" data-act="start" data-id="${s.id}">启动</button>`;
      }
    }
    return `<div class="card ${s.alive?'':'dead'} ${blocked?'blocked':''}">
      <div class="top"><span class="dot ${s.alive?'on':''}"></span>${link}
        <span class="spacer"></span><span class="port">:${s.port}</span></div>
      <div class="desc">${esc(s.desc)}</div>
      <div class="acts">${acts}${tags}</div>
    </div>`;
  }).join('');

  $('#repos').innerHTML = d.repos.map(r =>
    `<div class="repo"><b>${esc(r.name)}</b><span class="hint">${esc(r.desc)}</span>
      <span class="spacer"></span><code>${esc(r.path)}</code>
      <button class="mini" data-copy="${esc(r.path)}">复制</button></div>`).join('');
  $('#foot').textContent = onPhone
    ? '手机上只有标了「手机可用」的服务连得上，别的只监听电脑本机。'
    : '这些服务由 systemd 用户单元管着，登录桌面时自动起来。改清单：~/.config/hub/services.json，改完点刷新。';
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.copy){ copy(b.dataset.copy); return; }
  if(b.dataset.open){
    const s = cache.services.find(x=>x.id===b.dataset.open);
    window.open(url(s), '_blank', 'noopener');
    return;
  }
  if(b.dataset.act){
    const old = b.textContent; b.disabled = true; b.textContent = '…';
    try{
      const j = await api('/api/action', {id:b.dataset.id, action:b.dataset.act});
      toast(j.alive ? '好了' : '命令执行了，但端口还没起来，等两秒再看');
      await load();
    }catch(err){ toast(err.message); b.disabled=false; b.textContent=old; }
  }
});

let cache = {services:[], repos:[]};
async function load(){
  try{ cache = await api('/api/services'); render(cache); }
  catch(e){ toast('拿不到列表：'+e.message); }
}
$('#refresh').onclick = async () => { try{ await api('/api/reload', {}); }catch(e){} load(); };
load();
setInterval(load, 8000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
